name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Rust client on Linux: the platform-neutral half, plus the mingw cross-check.
  #
  # `cargo test` covers the platform-neutral half — state machine, spool, wire
  # codec, VAD, resampler, device matching, tier detection, foreign-audio
  # suppression. None of it needs audio hardware, a network or a database, which
  # is why it can be the fast job that gates every push.
  #
  # The `x86_64-pc-windows-gnu` cross-check is KEPT even though the `rust-windows`
  # job below now compiles the same code with MSVC. It is not redundant:
  #
  #   * It is cheap. It runs on a Linux runner that is already warm, and it fails
  #     in a couple of minutes rather than waiting on a Windows runner to boot.
  #   * It catches feature-flag rot specifically. `#[cfg(windows)]` code reached
  #     only through a target-specific dependency table is invisible to a Linux
  #     `cargo check`, and a feature that has been renamed or a
  #     `[target.'cfg(windows)'.dependencies]` entry that has been dropped shows
  #     up here first.
  #   * Two toolchains disagreeing is itself signal. mingw and MSVC differ on C
  #     ABI details in the `rusqlite` and `audiopus` build scripts, and a change
  #     that only builds under one of them is a change that will surprise someone.
  #
  # What it does NOT do is tell you the Windows code works — nothing is executed.
  # That is the `rust-windows` job's job.
  # --------------------------------------------------------------------------
  rust:
    name: Rust (Linux + mingw cross-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      # rusqlite is built with the `bundled` feature, so cross-checking the Windows
      # target compiles sqlite3.c with the mingw toolchain rather than just
      # type-checking Rust.
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: cargo test
        working-directory: client
        run: cargo test

      - name: cargo check (Windows target)
        working-directory: client
        run: cargo check --all-targets --target x86_64-pc-windows-gnu

      - name: cargo clippy
        working-directory: client
        # A real gate now: the tree is clippy-clean, so `-D warnings` costs nothing
        # to keep and is the only thing that stops the next warning becoming the
        # forty-first. Note this pins the gate to whatever `stable` resolves to on
        # the day, so a new lint in a future release can fail a build that changed
        # nothing -- fix the lint rather than dropping the flag.
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt --check
        working-directory: client
        # Advisory, not a gate. The client tree is not rustfmt-clean today
        # (most files differ) and is owned by another work stream, so failing the
        # build on it would block unrelated work. Drop continue-on-error after a
        # `cargo fmt` pass lands.
        continue-on-error: true
        run: cargo fmt --check

  # --------------------------------------------------------------------------
  # Rust client on Windows. This job exists because of the largest untested
  # surface in the repository.
  #
  # Everything under client/sentinel-capture/src/windows/ and
  # client/sentinel-service/src/windows/ — tier A process loopback, tier B
  # endpoint loopback, softphone session tracking, device-change notification, OS
  # build detection from the registry, the SCM entry point, the named-pipe host —
  # is `#[cfg(windows)]`. Until this job existed, that code was compiled by a
  # mingw `cargo check` and executed by nothing at all, on any platform. README.md
  # and docs/architecture.md both say to treat it as unverified rather than as
  # working, and that was accurate.
  #
  # What this job changes, in order of how much it is worth:
  #
  #   1. The whole platform-neutral suite now runs on the operating system the
  #      product ships on, compiled by the toolchain the product ships from. Paths
  #      (`\` vs `/`), the temp directory, file locking, `Local\` mutex namespaces
  #      and named-pipe behaviour all differ from Linux, and every one of those is
  #      touched by code under test (spool, update staging, crash-dump scan,
  #      single-instance guard, IPC codec).
  #   2. The Windows COM code is compiled by MSVC, which is what `build.ps1` uses.
  #      The mingw cross-check and MSVC do not agree about everything.
  #   3. `cargo clippy` finally sees the `cfg(windows)` code. On Linux clippy
  #      cannot lint what is compiled out, so the COM modules have never been
  #      linted by anything.
  #   4. **The shipped configuration is tested.** `build.ps1` builds with
  #      `--features sentinel-core/sqlcipher`; nothing in CI ever did. The
  #      difference is whether borrower call audio on the endpoint is encrypted at
  #      rest, and the `PRAGMA key` path in `sentinel-core/src/spool.rs` — including
  #      the wrong-key detection that exists so a bad key surfaces at open time
  #      rather than mid-call — had never been executed by anything, anywhere. See
  #      the release step below.
  #
  # What it still does not do: exercise a single line of WASAPI. See the
  # `rust-windows-audio` job for that seam and why it cannot live here.
  # --------------------------------------------------------------------------
  rust-windows:
    name: Rust (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          # This job builds the same workspace three ways — debug, and release
          # with `sqlcipher` — so its cache contents have nothing in common with
          # the Linux job's. rust-cache already keys on the runner OS, so the
          # explicit key is about keeping the debug and release+sqlcipher
          # artefacts of *this* job together rather than about cross-OS collision.
          key: msvc-sqlcipher

      # SQLCipher needs libcrypto. See the action for the full explanation; the
      # short version is that rusqlite's `bundled-sqlcipher` vendors SQLCipher's C
      # sources but links OpenSSL from the system, and `openssl-sys` reports a
      # missing native library as something that reads like a Rust error.
      - name: Provide OpenSSL for rusqlite/bundled-sqlcipher
        uses: ./.github/actions/sqlcipher-openssl

      # ---------------------------------------------------------------- debug
      # Fast and highest-signal first: this is the step that will catch a genuine
      # Windows behaviour difference, and it should fail before the runner has
      # spent twenty minutes on a release build.
      #
      # `--target` is redundant on a Windows host (it is already the host target)
      # and is passed anyway so the artefact layout is `target\x86_64-pc-windows-
      # msvc\<profile>`, exactly where build.ps1 looks. A CI job whose output
      # directory differs from the release build's is a job that can pass while
      # the release build cannot find its own binaries.
      - name: cargo test (MSVC, debug)
        working-directory: client
        # Deliberately no SENTINEL_TEST_AUDIO_HARDWARE here. A hosted runner has
        # no audio endpoint, no softphone and no interactive audio session, so any
        # test that needs one must skip rather than fail. See `rust-windows-audio`.
        run: cargo test --target x86_64-pc-windows-msvc

      # Not a gate, and not run: this prints the inventory of tests that have
      # declared themselves hardware-in-the-loop by being `#[ignore]`d. It exists
      # so the marker convention is visible in every CI log rather than being a
      # rule in a comment nobody reads, and so that a test which quietly stops
      # being ignored is noticed.
      - name: Hardware-in-the-loop tests (listed, not run)
        working-directory: client
        continue-on-error: true
        run: cargo test --target x86_64-pc-windows-msvc -- --ignored --list

      - name: cargo clippy (MSVC, sees the cfg(windows) code)
        working-directory: client
        # No `-D warnings`, deliberately diverging from the Linux job, which does
        # gate. The asymmetry is the point: Linux clippy is verified clean, so the
        # flag there costs nothing, whereas this run lints the cfg(windows) modules
        # Linux clippy never sees -- the COM capture paths, CNG, DPAPI -- and those
        # have never been linted anywhere, because this job has never run. Gating on
        # an unknown count would fail the first execution on lint debt rather than on
        # anything a change introduced.
        #
        # Turn this into a gate in its own commit, once one run has reported the
        # real count and it has been cleared. Until then a warning here is
        # information, which is more than we had.
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc

      # ------------------------------------------------ the shipped configuration
      # This is the step that closes the gap docs/security.md calls "the most
      # checkable gap in this document": the tested configuration was not the
      # shipped configuration, and the difference was encryption at rest for
      # borrower audio on the agent's desktop.
      #
      # Two things happen here that happen nowhere else in CI:
      #
      #   * `--features sentinel-core/sqlcipher` links SQLCipher instead of plain
      #     SQLite, so `Spool::from_connection`'s `PRAGMA key` branch and its
      #     wrong-key probe are compiled and executed. Without the feature that
      #     whole branch is `#[cfg]`-ed out and the spool tests pass against an
      #     unencrypted database.
      #   * `--release` trips the `compile_error!` guard in spool.rs if the feature
      #     is ever dropped, which means this step also verifies that the guard
      #     still guards.
      #
      # `--workspace` rather than `-p sentinel-core`: the release profile with this
      # feature set is what build.ps1 produces, and a feature-unification problem
      # between crates only appears when the whole workspace is resolved at once.
      #   * `sentinel-service/dev-software-device-key` is typed here and ONLY here.
      #     `SoftwareDeviceKey` refuses to be constructed in a release build unless
      #     that feature is named, so that a release can never use a file-backed key
      #     where a non-exportable CNG one is required. That gate is doing its job:
      #     without the feature, this step cannot run the software key's own test
      #     suite or the CSR tests that need a key to sign with, because the type
      #     under test declines to exist.
      #
      #     Typing it is exactly what the feature is for -- its own documentation
      #     calls out wanting the software path in an optimised build as the case it
      #     covers, and requires it to be typed rather than inferred. It applies to
      #     these TEST binaries only. The shipping build below deliberately does not
      #     pass it, which is what keeps the guarantee that matters: the binaries a
      #     customer receives still refuse a software key at compile time.
      - name: cargo test (release + sqlcipher — the configuration build.ps1 ships)
        working-directory: client
        run: >-
          cargo test --workspace --release
          --target x86_64-pc-windows-msvc
          --features sentinel-core/sqlcipher,sentinel-service/dev-software-device-key

      # Mirrors build.ps1 step 1 exactly — same target, same profile, same feature
      # spec, same package selection. It is nearly free after the step above
      # (identical profile and features, so the artefacts are already built) and it
      # is what proves the release workflow's first step can succeed before a tag
      # is pushed. A release workflow that fails on its own build is a release
      # workflow discovered at the worst moment.
      - name: cargo build (release, the two shipping binaries)
        working-directory: client
        run: >-
          cargo build --release
          --target x86_64-pc-windows-msvc
          -p sentinel-agent -p sentinel-service
          --features sentinel-core/sqlcipher

      - name: Verify both binaries exist where build.ps1 expects them
        working-directory: client
        shell: pwsh
        run: |
          # build.ps1 throws if either of these is missing after its cargo build.
          # Asserting it here means a rename lands as a CI failure on the pull
          # request rather than as a failed release build on a tag.
          $bin = "target\x86_64-pc-windows-msvc\release"
          foreach ($exe in @("SentinelAgent.exe", "SentinelService.exe")) {
            $p = Join-Path $bin $exe
            if (-not (Test-Path $p)) { throw "expected $p to exist" }
            Write-Host ("{0}  {1} bytes" -f $exe, (Get-Item $p).Length)
          }

      # The check that makes the sqlcipher build honest, and it belongs on every pull
      # request rather than only on a tag.
      #
      # Sentinel.wxs packages two executables and a widget.html. If either executable
      # imports a DLL that is not part of Windows, the MSI installs cleanly, registers
      # the service, and leaves a machine where the binary cannot start — install
      # reported success, fleet view says covered, nothing ever captured.
      #
      # `libsqlite3-sys/bundled-sqlcipher` emits `rustc-link-lib=dylib=libcrypto`, and
      # whether that becomes a `libcrypto-3-x64.dll` dependency depends only on which
      # kind of `libcrypto.lib` was on the link line. Both builds succeed identically.
      # This is the only thing that tells them apart.
      - name: Assert no stray DLL dependencies
        shell: pwsh
        run: |
          $bin = "client\target\x86_64-pc-windows-msvc\release"
          .\.github\scripts\assert-no-stray-dll-deps.ps1 `
            (Join-Path $bin "SentinelAgent.exe") `
            (Join-Path $bin "SentinelService.exe")

      # Unsigned, and therefore not shippable — this is a smoke-test artefact for
      # someone who wants to reproduce a Windows-only bug without a Windows box,
      # not a release. The release workflow is the only thing that produces a
      # customer artefact, and it signs. Short retention because these are large
      # and there is one per push.
      - name: Upload unsigned binaries (smoke testing only)
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-windows-unsigned-${{ github.sha }}
          path: |
            client/target/x86_64-pc-windows-msvc/release/SentinelAgent.exe
            client/target/x86_64-pc-windows-msvc/release/SentinelService.exe
            client/target/x86_64-pc-windows-msvc/release/*.pdb
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Hardware-in-the-loop: the tests a hosted runner physically cannot run.
  #
  # This job is disabled unless the repository sets the variable
  # SENTINEL_WINDOWS_AUDIO_RUNNER to 'true' and registers a self-hosted runner
  # labelled [self-hosted, windows, audio]. It is written now, red never, so the
  # seam exists before the hardware does.
  #
  # WHAT ACTUALLY NEEDS HARDWARE, named honestly rather than hand-waved. Every one
  # of these is a function that cannot return a truthful answer on a hosted runner
  # because the runner has no audio endpoint, no softphone process and no
  # interactive audio session:
  #
  #   * `sentinel-capture/src/windows/process_loopback.rs` — tier A capture via
  #     ActivateAudioInterfaceAsync with
  #     AUDIOCLIENT_ACTIVATION_TYPE_PROCESS_LOOPBACK. Needs a live process that is
  #     rendering audio. On a runner there is no such process, and the activation
  #     completes with a stream that never produces a buffer, which is
  #     indistinguishable from the bug we would be testing for.
  #   * `sentinel-capture/src/windows/endpoint_loopback.rs` — tier B capture from a
  #     pinned render endpoint. Needs a real render endpoint. Hosted Windows
  #     runners have no audio device at all; IMMDeviceEnumerator returns an empty
  #     collection, so `GetDefaultAudioEndpoint` fails with E_NOTFOUND and the test
  #     would be asserting on the failure path forever.
  #   * `sentinel-capture/src/windows/session.rs` — softphone audio session
  #     tracking via IAudioSessionManager2. Needs an audio session, which needs a
  #     process rendering to a device that does not exist.
  #   * `sentinel-capture/src/windows/notification.rs` — IMMNotificationClient
  #     device add/remove/default-change callbacks. Needs a device to arrive or
  #     leave. Nothing plugs a headset into a hosted runner.
  #   * Foreign-audio suppression end to end. The unit tests in
  #     `sentinel-capture/src/foreign.rs` cover the decision logic against
  #     synthetic input, which is the right place for it. What they cannot cover is
  #     the timing relationship the module is built around — that the session state
  #     notification leads and lags the actual audio — because that relationship is
  #     a property of the audio engine, not of our code.
  #
  # The convention, and it mirrors the Go integration tests' `t.Skip` on absent
  # SENTINEL_TEST_* variables so there is one pattern in the repository rather than
  # two:
  #
  #   * Mark a hardware-in-the-loop test `#[ignore]` with a reason. `cargo test`
  #     then skips it everywhere by default and it can never turn a hosted runner
  #     red.
  #   * Have it also check `std::env::var("SENTINEL_TEST_AUDIO_HARDWARE")` and
  #     return early if unset, so running it by hand on a developer laptop without
  #     a headset produces a skip rather than a confusing COM error.
  #
  # Deleting these tests, or writing them to assert the no-device failure path, are
  # both worse than not having them: this product's dangerous failure mode is
  # looking healthy while capturing nothing, and a green test suite that proves
  # capture cannot start is that failure mode in test form.
  # --------------------------------------------------------------------------
  rust-windows-audio:
    name: Rust (Windows, audio hardware)
    if: vars.SENTINEL_WINDOWS_AUDIO_RUNNER == 'true'
    runs-on: [self-hosted, windows, audio]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Provide OpenSSL for rusqlite/bundled-sqlcipher
        uses: ./.github/actions/sqlcipher-openssl

      # `--include-ignored` rather than `--ignored`: run the whole suite on the
      # machine that has the hardware, so a hardware test that passes while a
      # neutral test regresses is not reported as a pass.
      #
      # The pinned container ID is deliberately a repository variable and not a
      # secret: it identifies a headset model, not a credential, and having it
      # legible in the log is how you diagnose "capture did not arm" on the rig.
      - name: cargo test (release + sqlcipher, including hardware tests)
        working-directory: client
        env:
          SENTINEL_TEST_AUDIO_HARDWARE: '1'
          SENTINEL_TEST_PINNED_CONTAINER_ID: ${{ vars.SENTINEL_TEST_PINNED_CONTAINER_ID }}
        run: >-
          cargo test --workspace --release
          --target x86_64-pc-windows-msvc
          --features sentinel-core/sqlcipher
          -- --include-ignored

  # --------------------------------------------------------------------------
  # Go gateway, including the Postgres-backed integration tests.
  #
  # The service image is PostgreSQL 16 with pgvector, because db/migrations/0001
  # does `CREATE EXTENSION vector` for the transcript embedding column and the
  # stock postgres:16 image does not carry it. db/test/pgtest.sh works around a
  # missing pgvector with a stub extension, but that path needs to boot its own
  # cluster; against a service container it is simpler to use an image that has
  # the real thing, which is also what production runs.
  #
  # This mirrors db/test/gateway_it.sh: the app DSN connects as sentinel_app
  # (NOBYPASSRLS, the role the gateway really uses), and the admin DSN is the
  # schema owner, used by the tests for seeding and for reading back rows the
  # application role must not be able to see.
  # --------------------------------------------------------------------------
  go:
    name: Go gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sentinel_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/gateway/go.mod
          cache-dependency-path: server/gateway/go.sum

      - name: Apply migrations
        run: |
          set -euo pipefail
          for f in db/migrations/*.up.sql; do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          # 0003 creates sentinel_app with LOGIN and no password; the tests connect
          # over TCP, so give it one.
          psql -v ON_ERROR_STOP=1 -q \
            -c "ALTER ROLE sentinel_app WITH PASSWORD 'sentinel_test'"

      - name: go build
        working-directory: server/gateway
        run: go build ./...

      - name: go vet
        working-directory: server/gateway
        run: go vet ./...

      - name: go test
        working-directory: server/gateway
        env:
          SENTINEL_TEST_DATABASE_URL: postgres://sentinel_app:sentinel_test@127.0.0.1:5432/sentinel_test?sslmode=disable
          SENTINEL_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sentinel_test?sslmode=disable
        run: go test ./...

  # --------------------------------------------------------------------------
  # Row-level security acceptance tests.
  #
  # These cannot use a service container: db/test/pgtest.sh boots its own cluster
  # with initdb so that it can run the assertions as sentinel_app against a
  # freshly migrated database. Run as root so pgtest.sh can install its stub
  # vector extension and then drop privileges to the postgres user, which is the
  # path it is written for. The RLS assertions never touch a vector column, so
  # the stub is sufficient here.
  # --------------------------------------------------------------------------
  db:
    name: Database (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PostgreSQL 16 server binaries
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi

      - name: Row-level security acceptance tests
        run: sudo -E bash db/test/rls_test.sh

  # --------------------------------------------------------------------------
  # Python pipeline.
  # --------------------------------------------------------------------------
  python:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/pipeline/pyproject.toml

      - name: Install
        working-directory: server/pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: pytest
        working-directory: server/pipeline
        run: python -m pytest -q

  # --------------------------------------------------------------------------
  # Contracts. contracts/ is the source of truth for client, gateway and web, so
  # a contract that does not parse breaks all three at once.
  # --------------------------------------------------------------------------
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: pip install jsonschema openapi-spec-validator

      - name: Validate contracts/openapi.yaml
        run: |
          python - <<'PY'
          from openapi_spec_validator import validate
          from openapi_spec_validator.readers import read_from_filename

          spec, _ = read_from_filename("contracts/openapi.yaml")
          validate(spec)
          print(f"openapi.yaml ok: {len(spec['paths'])} paths")
          PY

      - name: Validate JSON Schemas and wire fixtures
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          from jsonschema import validators

          schemas = sorted(pathlib.Path("contracts/schemas").glob("*.json"))
          if not schemas:
              sys.exit("contracts/schemas: no schemas found")

          for path in schemas:
              document = json.loads(path.read_text(encoding="utf-8"))
              # Honour whatever dialect each schema declares rather than assuming one.
              cls = validators.validator_for(document)
              cls.check_schema(document)
              print(f"{path} ok ({cls.__name__})")

          # The wire vectors are read by both the Rust and the Go codec tests; if the
          # file stops being valid JSON, both fail with a confusing error instead.
          fixture = pathlib.Path("contracts/fixtures/wire_vectors.json")
          json.loads(fixture.read_text(encoding="utf-8"))
          print(f"{fixture} ok")
          PY

  # --------------------------------------------------------------------------
  # Web: @sentinel/shared, @sentinel/widget, @sentinel/portal.
  #
  # This job used to skip itself. It carried an `npm ci --dry-run` guard and four
  # `if:` lines because web/package-lock.json predated the @sentinel/shared and
  # @sentinel/portal workspaces, so `npm ci` refused to run at all and the job
  # would otherwise have been a permanently red check that everyone learned to
  # ignore. The guard's own comment said to delete it and the four `if:` lines once
  # the lockfile landed. The lockfile has landed, so it is deleted, and this is now
  # a real gate.
  #
  # Two properties of the shape it replaces are worth keeping in mind, because they
  # are the reason to go back to `npm ci` rather than staying on `npm install`:
  #
  #   * `npm ci` fails when the lockfile and the manifests disagree. `npm install`
  #     silently *fixes* the disagreement by rewriting the lockfile, which means a
  #     dependency bump merged without its lockfile change would pass CI and then
  #     resolve differently on the next machine. For a bundle that ends up inside a
  #     signed MSI, "resolved differently on the next machine" is a supply-chain
  #     answer nobody wants to give a bank's security reviewer.
  #   * `npm ci` deletes node_modules first, so it also catches a dependency that
  #     only works because it is already installed.
  #
  # If this job goes red on a lockfile-out-of-sync error again, the fix is `npm
  # install` in web/ with the regenerated lockfile committed — never a re-added
  # guard, and never `npm install` in CI.
  #
  # The MSI depends on `npm run build` here: the release workflow builds
  # web/widget and stages its output as the WebDir payload. A web job that skips
  # is a release that ships a stale or missing widget bundle.
  # --------------------------------------------------------------------------
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
