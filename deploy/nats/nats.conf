# NATS with JetStream and authentication.
#
# ==============================================================================
# WHY AUTHENTICATION IS NOT OPTIONAL HERE
#
# There is no NATS authentication anywhere else in this repository:
# `sentinel_pipeline/consumer.py`'s ConsumerConfig defaults to
# `nats://127.0.0.1:4222` with no credentials, which is fine for a unit test that
# never connects and is not fine for anything with a network interface.
#
# What an unauthenticated JetStream on a floor network gives an attacker who can reach
# port 4222 -- which, on a BPO network, is a broad set of people:
#
#   * **Publish `sentinel.call.finalize`.** Every message triggers ASR and one or more
#     LLM calls. Model spend is the product's dominant variable cost, and it is
#     per-tenant and budgeted (`cost.py`). An outsider can spend a tenant's monthly
#     budget in minutes and trip the kill switch, at which point real calls stop being
#     analysed. Compliance findings simply stop being produced, and nothing about that
#     looks like an attack.
#   * **Drain the stream.** A consumer that acks and discards silently loses calls the
#     gateway has already acknowledged to the endpoint agent -- and the agent's spool
#     deletes a segment only after that ack, so its copy is already gone. Those calls
#     are unrecoverable and show up later only as a coverage gap against the dialer
#     CDR, months after the audio existed.
#   * **Read the stream.** Finalize messages are call identifiers rather than call
#     content, so this is the least bad of the three -- but a call id plus tenant id is
#     enough to enumerate a tenant's call volume, which is commercially sensitive on
#     its own.
#
# ==============================================================================
# THE ONE PARSING SUBTLETY IN THIS FILE, BECAUSE IT WILL BITE SOMEONE
#
# nats-server resolves `$NAME` in an UNQUOTED value against its own variables and then
# the process environment. It does NOT resolve `$` inside a quoted string.
#
# That is exactly the distinction this file depends on:
#
#   user: $NATS_GATEWAY_USER          <- unquoted, so it is substituted from the env
#   allow: ["$JS.API.>"]              <- quoted, so it stays the literal JetStream
#                                        API subject prefix
#
# Quote the credential and the server starts with a user literally named
# "$NATS_GATEWAY_USER". Unquote the JetStream subject and the server refuses to start
# with "variable reference for 'JS.API.>' cannot be found". Both failures are
# confusing; neither is the one you would guess from the symptom.
# ==============================================================================

# Client port. Not exposed to the host by deploy/compose.yaml beyond localhost -- see
# the port mapping comment there.
port: 4222

# Monitoring endpoint. /healthz on this port is what the container's healthcheck hits;
# it is also where JetStream stream and consumer state is readable, which is the
# fastest way to answer "is the pipeline keeping up" without a Grafana.
#
# It carries no authentication of its own, which is why compose binds it to 127.0.0.1.
# It exposes account names, subject names and message counts -- machine state, no call
# content -- but subject names and per-tenant message counts are still more than a
# floor network should be able to read anonymously.
http: 8222

server_name: sentinel-nats

jetstream {
  store_dir: /data/jetstream

  # File-backed, not memory-backed. A finalize message represents a call whose audio
  # the endpoint agent has already deleted, because the gateway acked it. Losing one
  # to a broker restart loses the analysis of a real call permanently, and the loss is
  # invisible until a coverage reconciliation notices it. Memory storage for this
  # stream would be trading durability for a latency nobody needs: analysis of a
  # forty-minute call takes a minute anyway.
  max_memory_store: 256MB

  # Local/dev sizing. A real deployment sizes this from call volume times retention;
  # the numbers are small here so a developer's disk is not filled by a stack they
  # forgot to stop.
  max_file_store: 4GB
}

# ------------------------------------------------------------------------ accounts
#
# Two accounts, and separate users within the application account.
#
# Why accounts at all rather than one user with a password: accounts are NATS's
# isolation boundary, and the system account in particular must not be reachable by an
# application credential. A leaked pipeline password should not be able to read
# $SYS.> and enumerate every other connection on the server.
#
# Why separate gateway and pipeline users inside one account: they need genuinely
# different permissions, and expressing that is what stops one component's credential
# from doing the other's job. The gateway publishes finalize messages and must not be
# able to consume them; the pipeline consumes them and must not be able to mint them.
# A single shared credential would make the "publish garbage to spend the budget"
# attack available to whichever of the two is easier to compromise -- and the gateway
# is the one on the public internet.
accounts {
  SENTINEL: {
    jetstream: enabled

    users: [
      {
        # The Go gateway. Publishes a finalize message when a call is complete.
        user: $NATS_GATEWAY_USER
        password: $NATS_GATEWAY_PASSWORD
        permissions: {
          publish: {
            allow: [
              "sentinel.call.finalize"
              # JetStream is driven entirely by request/reply against $JS.API, so a
              # publisher that needs publish acknowledgement needs this. Scoped to
              # the stream's own API subjects rather than "$JS.API.>": with the
              # broader form, this credential could delete the stream, and "the
              # gateway's credential can delete the queue" is not a property worth
              # having.
              "$JS.API.INFO"
              "$JS.API.STREAM.INFO.SENTINEL"
            ]
          }
          subscribe: {
            # Reply inboxes only. The gateway must not be able to subscribe to
            # sentinel.call.finalize: a component that can both publish and consume
            # the queue can also quietly drain it.
            allow: ["_INBOX.>"]
          }
        }
      }
      {
        # The Python pipeline workers. Pull-subscribe the finalize subject, publish to
        # the dead-letter subject.
        user: $NATS_PIPELINE_USER
        password: $NATS_PIPELINE_PASSWORD
        permissions: {
          publish: {
            allow: [
              "sentinel.call.dlq"
              # Consumer create/bind, fetch and ack all go through $JS.API. Restricted
              # to this stream so the credential cannot enumerate or interfere with
              # any other stream that later shares the account.
              "$JS.API.INFO"
              "$JS.API.STREAM.INFO.SENTINEL"
              "$JS.API.CONSUMER.CREATE.SENTINEL.>"
              "$JS.API.CONSUMER.DURABLE.CREATE.SENTINEL.>"
              "$JS.API.CONSUMER.INFO.SENTINEL.>"
              "$JS.API.CONSUMER.MSG.NEXT.SENTINEL.>"
              "$JS.ACK.SENTINEL.>"
            ]
          }
          subscribe: {
            allow: ["sentinel.>", "_INBOX.>"]
          }
        }
      }
    ]
  }

  # System account. Reachable only by its own credential; used by `nats server report`
  # and by anything scraping server statistics. Deliberately has no JetStream and no
  # application subjects.
  SYS: {
    users: [
      { user: $NATS_SYS_USER, password: $NATS_SYS_PASSWORD }
    ]
  }
}

system_account: SYS

# Deliberately NOT set: `no_auth_user`. That directive maps unauthenticated
# connections onto a named user, which is a convenient way to keep an old client
# working and is indistinguishable, from the server's point of view, from having no
# authentication at all. If a component cannot present credentials, fix the component.
#
# Also deliberately not set: `authorization { token: ... }`. A single shared bearer
# token gives every component the same permissions, which throws away the
# publisher/consumer split above.

# Reject a client that has not authenticated within two seconds. The default is 2s
# already; stated explicitly because it is a real defence against connection-slot
# exhaustion by clients that open a socket and stop.
authorization {
  timeout: 2
}

# TLS is NOT configured here, and that is a local/dev decision rather than a
# recommendation. On a real deployment NATS should carry TLS: the credentials above go
# over the wire on connect, and a floor network is not a trusted network. Add a `tls
# { cert_file, key_file }` block and point SENTINEL_NATS_URL at tls:// when this leaves
# a developer's machine.
