openapi: 3.1.0
info:
  title: MagickVoice Sentinel API
  version: 1.0.0
  description: |
    Source of truth for the Sentinel REST surface. Client, gateway and web all
    generate types from this file; a change to an API shape starts here.

    **Authorisation model.** Every route except `/v1/devices/enroll` and `/healthz`
    requires a Google Cloud Identity Platform ID token as a bearer credential.
    `tenant_id`, `role` and `team_id` are read from the *verified token claims* and
    never from a request body or path parameter. Endpoints under `/v1/me` derive the
    subject UID from the token; a UID supplied by the caller is ignored.

    Device-scoped routes (`/v1/policy`, `/v1/heartbeat`, `/v1/ingest`) additionally
    require mutual TLS with the certificate issued at enrollment.
servers:
  - url: https://api.sentinel.magickvoice.com
    description: production (ap-south-1)
  - url: http://localhost:8080
    description: local development

tags:
  - name: calls
  - name: device
  - name: session
  - name: me
  - name: team
  - name: compliance
  - name: admin

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: health
      security: []
      summary: Liveness probe
      description: |
        Answers as long as the process is alive and deliberately checks nothing.
        This is the liveness probe: a gateway whose database is down should be left
        alone to recover rather than killed and restarted into the same dead
        database. Use `/readyz` to decide whether to send it traffic.
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }

  /readyz:
    get:
      operationId: readiness
      security: []
      summary: Readiness probe — checks the database and the object store
      description: |
        Answers the question `/healthz` does not: should this instance be sent
        traffic. It probes the dependencies rather than returning a constant,
        because a gateway whose object store is unreachable still accepts the ingest
        upgrade, still authenticates the device, and then fails every segment write.
        Nothing about that is visible from the desktop, which keeps retrying, so the
        audio sits in the spool until the 72-hour bound evicts it and the loss
        surfaces weeks later as a coverage gap.

        Each check reports only `ok` or `failed`. The endpoint is unauthenticated by
        necessity — a kubelet cannot present a bearer token — and a database or S3
        error message carries a hostname, a DSN or a role ARN. The detail goes to
        the gateway's log, tied to this request by `X-Request-Id`.
      responses:
        '200':
          description: every dependency is reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: at least one dependency is unreachable; stop routing to this instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /v1/oauth/token:
    post:
      operationId: oauthToken
      tags: [session]
      security: []
      summary: OAuth 2.0 token endpoint for the desktop agent (RFC 6749)
      description: |
        The desktop agent's OIDC configuration points `token_endpoint` at this
        route (`client/sentinel-agent/src/auth/pkce.rs`), and the gateway brokers
        the exchange to Google Cloud Identity Platform server-side.

        **Why the gateway is in this path.** An authorization-code exchange against
        Google's OAuth endpoint wants a client secret, and turning the resulting
        Google ID token into an Identity Platform ID token — the kind every other
        route here verifies — wants the project's Web API key. Neither can be
        shipped to 200 collections desktops: a key in an MSI is a published key,
        rotating it is a fleet rollout through the customer's SCCM, and the machines
        are ones agents have physical access to. This endpoint is where those
        credentials can live. It is the same argument `docs/architecture.md` makes
        for keeping model provider keys off the endpoint.

        **The desktop is a public client** (RFC 8252 §8.4). It sends no client
        secret and PKCE replaces one. A `client_secret` in the request is *refused*
        rather than ignored, because its presence means either that a secret has
        been distributed to the fleet and needs revoking, or that some other client
        is calling this endpoint expecting confidential-client semantics it will not
        get.

        **PKCE is mandatory on the code grant.** A request without `code_verifier`
        is refused rather than forwarded: forwarding it would let anyone holding an
        intercepted authorization code redeem it here. `redirect_uri` must be a
        literal loopback address with a port (`http://127.0.0.1:{port}/...` or
        `http://[::1]:{port}/...`) per RFC 8252 §7.3 — not `localhost`, which the
        agent never produces.

        The route sits outside the authentication middleware, because there is no
        token yet, and is rate-limited per client address for that reason. Errors
        use the RFC 6749 §5.2 shape rather than this API's usual `Error` envelope;
        `X-Request-Id` still carries the trace.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: tokens issued
          headers:
            Cache-Control:
              description: always `no-store` (RFC 6749 §5.1)
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: |
            `invalid_request` (malformed), `invalid_grant` (expired or already-used
            code, dead refresh token, non-loopback redirect), or
            `unsupported_grant_type`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: '`invalid_client` — a client secret was sent by a public client'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: '`unauthorized_client` — the account is suspended or unknown'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429':
          description: rate limited; honour `Retry-After`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: '`server_error` — the identity provider could not be reached'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '503':
          description: '`temporarily_unavailable` — no identity provider is configured, or it is rate limiting us'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  /v1/devices/enroll:
    post:
      operationId: enrollDevice
      tags: [device]
      security: []
      summary: Exchange a single-use enrollment token and a CSR for a device certificate
      description: |
        Consumes an enrollment token minted in the portal (TTL 24 h, tenant-scoped).
        The private key never leaves the endpoint: it is generated in CNG, marked
        non-exportable, and only the CSR is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '201':
          description: certificate issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: enrollment token invalid, expired, or already consumed
        '409':
          description: machine_guid already enrolled for this tenant with a different fingerprint

  /v1/sessions:
    post:
      operationId: createSession
      tags: [session]
      summary: Open a Sentinel session and receive a policy snapshot
      responses:
        '200':
          description: session opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: device revoked or user not permitted on this device

  /v1/sessions/current:
    delete:
      operationId: endSession
      tags: [session]
      summary: Sign out. The client MUST flush its spool before calling this.
      responses:
        '204': { description: signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/policy:
    get:
      operationId: getPolicy
      tags: [device]
      summary: Capture configuration for this device and tenant
      responses:
        '200':
          description: policy snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/ingest:
    get:
      operationId: ingest
      tags: [device]
      summary: WebSocket upgrade for audio ingest
      description: |
        The binary protocol is specified in `contracts/wire.md`, not here — OpenAPI
        cannot describe a bidirectional frame protocol, and an approximation would
        be a second source of truth that drifts.

        Documented in this file anyway so the route is discoverable: an endpoint that
        exists in the router but not in the contract is the one a security review
        finds and nobody can explain.

        Requires mutual TLS with the device certificate **and** a bearer token. The
        tenant is derived from both and they must agree; a mismatch closes the socket
        with 4403.
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema: { type: string, const: websocket }
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema: { type: string, const: sentinel.v1 }
      responses:
        '101':
          description: switching protocols; see contracts/wire.md
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: device revoked, or the certificate and token disagree on tenant

  /v1/heartbeat:
    post:
      operationId: heartbeat
      tags: [device]
      summary: Report capture state, tier, version and spool depth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Heartbeat' }
      responses:
        '200':
          description: accepted
          content:
            application/json:
              schema:
                type: object
                required: [policy_version, server_time]
                properties:
                  policy_version: { type: integer }
                  server_time: { type: string, format: date-time }
                  commands:
                    type: array
                    description: out-of-band instructions, e.g. force update or stop capture
                    items:
                      type: object
                      required: [kind]
                      properties:
                        kind:
                          type: string
                          enum: [refetch_policy, stop_capture, update_now, flush_spool]
                        detail: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: device revoked — client MUST stop capture

  /v1/calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: Calls visible at the caller's scope
      description: |
        One listing for every role. The visible set is decided by row-level security
        from the verified token, not by the path: an agent sees their own calls, a
        supervisor their team's, qa/compliance/admin the whole tenant, and a bank
        client only flagged calls.

        This exists because the role matrix grants qa, compliance and admin "all
        tenant calls" and the `me` and `teams` listings cannot express that — the
        call explorer is the workhorse screen and a QA reviewer has to be able to
        reach any call in the tenant.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: user_uid, in: query, schema: { type: string }, description: narrows within the caller's scope; it can never widen it }
        - { name: team_id, in: query, schema: { type: string, format: uuid } }
        - { name: disposition, in: query, schema: { $ref: '#/components/schemas/Disposition' } }
        - { name: has_flags, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string }, description: full-text over transcripts in scope }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: page of calls
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallPage' }

  /v1/calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: One call, if it is visible at the caller's scope
      description: |
        Returns 404 rather than 403 for a call outside the caller's scope: whether a
        given call id exists in another team is itself information. Every read is
        written to the audit log — a compliance product has to be able to answer who
        listened to a borrower's call.
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: call detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/teams:
    get:
      operationId: listTeams
      tags: [team]
      summary: Teams visible to the caller
      description: |
        Team membership reaches the client only as a single `team_id` claim, so a
        supervisor responsible for more than one team has no other way to discover
        them.
      responses:
        '200':
          description: teams
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }

  /v1/me/calls:
    get:
      operationId: listMyCalls
      tags: [me]
      summary: The signed-in agent's own calls
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: disposition, in: query, schema: { $ref: '#/components/schemas/Disposition' } }
        - { name: q, in: query, schema: { type: string }, description: full-text over own transcripts }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: page of calls
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallPage' }

  /v1/me/calls/{id}:
    get:
      operationId: getMyCall
      tags: [me]
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      responses:
        '200':
          description: call detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/calls/{id}/confirm:
    post:
      operationId: confirmMyCall
      tags: [me]
      summary: Agent confirms or corrects disposition and PTP
      description: |
        Permitted within `tenants.ptp_correction_window_hours` of `ended_at`
        (default 24). Writes `ptps.agent_*` columns and an audit entry; never
        overwrites the model's extraction in place.
      parameters: [{ $ref: '#/components/parameters/CallId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallConfirmation' }
      responses:
        '200':
          description: confirmation recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: correction window has closed }

  /v1/me/stats:
    get:
      operationId: getMyStats
      tags: [me]
      summary: The agent's own numbers alongside their team median
      description: |
        The median is returned here because the agent self-view is defined as a
        comparison against it, and the scorecards endpoint that also carries it is
        gated on a capability agents do not hold.

        Aggregates only. No per-agent numbers and no colleague names cross this
        boundary, and there is deliberately no endpoint that hands an agent the
        ranked list: leaderboards on a collections floor produce gaming, not
        improvement. `median` is null when the agent belongs to no team.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: stats
          content:
            application/json:
              schema:
                type: object
                required: [self]
                properties:
                  self: { $ref: '#/components/schemas/AgentStats' }
                  median:
                    allOf: [{ $ref: '#/components/schemas/AgentStats' }]
                    nullable: true

  /v1/me/flags:
    get:
      operationId: listMyFlags
      tags: [me]
      summary: Compliance flags raised on the signed-in agent's own calls
      responses:
        '200':
          description: flags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Flag' }

  /v1/me/flags/{id}/respond:
    post:
      operationId: respondToMyFlag
      tags: [me]
      summary: Agent contests or explains a flag on their own call
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: response recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flag' }

  /v1/teams/{id}/calls:
    get:
      operationId: listTeamCalls
      tags: [team]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: user_uid, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: page of calls
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/teams/{id}/scorecards:
    get:
      operationId: getTeamScorecards
      tags: [team]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: per-agent scorecards plus the team median
          content:
            application/json:
              schema:
                type: object
                required: [median, agents]
                properties:
                  median: { $ref: '#/components/schemas/AgentStats' }
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/AgentStats' }

  /v1/teams/{id}/live/ticket:
    post:
      operationId: createLiveTicket
      tags: [team]
      summary: Mint a short-lived ticket for the SSE stream
      description: |
        `EventSource` cannot send an `Authorization` header, so the browser cannot
        present a bearer token on the live stream. Rather than accept the token in a
        query string — where it would land in access logs and proxy caches — the
        caller exchanges its token for a single-use ticket, scoped to one team, valid
        for 60 seconds and consumed on connect.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: ticket minted
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_at]
                properties:
                  ticket: { type: string }
                  expires_at: { type: string, format: date-time }

  /v1/teams/{id}/live:
    get:
      operationId: streamTeamLive
      tags: [team]
      summary: SSE stream of active calls for the floor view
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: ticket
          in: query
          required: true
          schema: { type: string }
          description: single-use ticket from POST /v1/teams/{id}/live/ticket
      responses:
        '200':
          description: |
            A `text/event-stream` carrying three named event types:

            * `call` — a `LiveCallEvent`, re-sent every poll for each in-flight call.
            * `call_ended` — `{"call_id": "..."}`, sent once when a call leaves the
              set. Without it a client can only remove rows by guessing at staleness,
              and cannot tell a finished call from a frozen stream.
            * `snapshot` — `{"count": n}`, closing each batch, so a client that
              missed a `call_ended` can reconcile against the complete set.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/LiveCallEvent' }

  /v1/compliance/flags:
    get:
      operationId: listFlags
      tags: [compliance]
      parameters:
        - { name: severity, in: query, schema: { $ref: '#/components/schemas/Severity' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/FlagStatus' } }
        - { name: rule_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: flag queue
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Flag' }
                  next_cursor: { type: string, nullable: true }

  /v1/compliance/flags/{id}:
    patch:
      operationId: updateFlag
      tags: [compliance]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/FlagStatus' }
                reviewer_uid: { type: string }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flag' }

  /v1/compliance/exports:
    post:
      operationId: createEvidenceExport
      tags: [compliance]
      summary: Queue an evidence pack (transcript spans, flags, audio where policy allows)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flag_ids]
              properties:
                flag_ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                include_audio: { type: boolean, default: false }
      responses:
        '202':
          description: export queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status]
                properties:
                  job_id: { type: string, format: uuid }
                  status: { type: string, enum: [queued, running, ready, failed] }
                  download_url: { type: string, nullable: true }

  /v1/admin/devices:
    get:
      operationId: listDevices
      tags: [admin]
      summary: Fleet view — tier distribution and coverage gaps
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, revoked, stale] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: fleet
          content:
            application/json:
              schema:
                type: object
                required: [items, tier_distribution]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
                  tier_distribution:
                    type: object
                    properties:
                      A: { type: integer }
                      B: { type: integer }
                  next_cursor: { type: string, nullable: true }

  /v1/admin/devices/{id}/revoke:
    post:
      operationId: revokeDevice
      tags: [admin]
      summary: Revoke a device. Live connections MUST be terminated within 60 s.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '204': { description: revoked }

  /v1/admin/enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      tags: [admin]
      responses:
        '201':
          description: token minted
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }

  /v1/admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      responses:
        '200':
          description: users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }

  /v1/admin/users/{uid}:
    patch:
      operationId: updateUser
      tags: [admin]
      parameters: [{ name: uid, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                team_id: { type: string, format: uuid, nullable: true }
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /v1/admin/rules:
    get:
      operationId: getRules
      tags: [admin]
      responses:
        '200':
          description: active rule set plus version history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSet' }
    put:
      operationId: putRules
      tags: [admin]
      summary: Publish a new rule-set version. Never mutates an existing version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleSetDefinition' }
      responses:
        '201':
          description: new version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSet' }

  /v1/admin/audit:
    get:
      operationId: getAuditLog
      tags: [admin]
      parameters:
        - { name: actor_uid, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  next_cursor: { type: string, nullable: true }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity Platform ID token, verified server-side against Google's public keys.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    CallId:
      name: id
      in: path
      required: true
      schema: { type: string, description: ULID or UUID rendering of the call id }

  responses:
    BadRequest:
      description: malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: missing, expired or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: not found, or not visible at the caller's scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }

    OAuthError:
      type: object
      description: |
        RFC 6749 §5.2. Deliberately not the `Error` envelope above: the caller at
        `/v1/oauth/token` is an OAuth client following a specification, and every
        OAuth client library ever written parses this shape. The request id is still
        returned in the `X-Request-Id` header.
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client,
                 unsupported_grant_type, invalid_scope, server_error,
                 temporarily_unavailable]
        error_description: { type: string }

    TokenRequest:
      type: object
      description: |
        `application/x-www-form-urlencoded`. Which fields are required depends on
        `grant_type`: `authorization_code` needs `code`, `code_verifier` and
        `redirect_uri`; `refresh_token` needs `refresh_token`. `client_secret` is
        refused outright — see the endpoint description.
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
          description: authorization_code grant — the code from the loopback callback
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: |
            authorization_code grant, **required**. RFC 7636 §4.1: 43–128 characters
            from `ALPHA / DIGIT / "-" / "." / "_" / "~"`. An exchange without one is
            refused rather than forwarded.
        redirect_uri:
          type: string
          description: |
            authorization_code grant — the loopback address the agent bound, with
            its port. RFC 8252 §7.3, and the literal address rather than `localhost`.
          example: http://127.0.0.1:49712/callback
        client_id:
          type: string
          description: checked against the deployment's configured client, not trusted
        refresh_token:
          type: string
          description: refresh_token grant

    TokenResponse:
      type: object
      description: |
        The field set is fixed by `TokenResponse` in
        `client/sentinel-agent/src/api.rs`, which prefers `id_token` and falls back
        to `access_token`. `token_type` is present because RFC 6749 §5.1 requires
        it. Nothing may be added here without changing the Rust client in the same
        commit.
      required: [id_token, expires_in, token_type]
      properties:
        id_token:
          type: string
          description: the Identity Platform ID token every other route verifies
        access_token:
          type: string
          description: present only when the provider issued one distinct from the ID token
        refresh_token:
          type: string
          description: |
            omitted, not empty, on a refresh that did not rotate it — the previous
            one stays valid
        expires_in:
          type: integer
          description: ID token lifetime in seconds; always stated, defaulting to 3600
        token_type: { type: string, const: Bearer }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        version: { type: string }
        checks:
          type: object
          description: |
            One entry per configured dependency — `database`, `object_store` — whose
            value is `ok` or `failed`. Never an error message: this endpoint is
            unauthenticated.
          additionalProperties: { type: string, enum: [ok, failed] }

    Role:
      type: string
      enum: [agent, supervisor, qa, compliance, admin, client]

    Severity:
      type: string
      enum: [low, medium, high, critical]

    FlagStatus:
      type: string
      enum: [open, assigned, upheld, dismissed]

    Disposition:
      type: string
      enum: [ptp, refusal, dispute, wrong_number, no_contact, callback_requested,
             partial_payment, escalation, other]

    CaptureTier:
      type: string
      enum: [A, B]

    CaptureState:
      type: string
      enum: [IDLE, ARMED, IN_CALL, WRAP, FINALIZE, BLOCKED]

    EnrollRequest:
      type: object
      required: [enrollment_token, csr_pem, machine_guid, hw_fingerprint, os_build, capture_tier, agent_version]
      properties:
        enrollment_token: { type: string }
        csr_pem: { type: string, description: PKCS#10 CSR, P-256 key held non-exportably in CNG }
        machine_guid: { type: string }
        hw_fingerprint:
          type: string
          description: SHA-256 of machine GUID + baseboard serial + primary MAC
        os_build: { type: string, example: '10.0.22631' }
        capture_tier: { $ref: '#/components/schemas/CaptureTier' }
        agent_version: { type: string }

    EnrollResponse:
      type: object
      required: [device_id, certificate_pem, ca_chain_pem, not_after]
      properties:
        device_id: { type: string, format: uuid }
        certificate_pem: { type: string }
        ca_chain_pem: { type: string }
        not_after: { type: string, format: date-time }

    SessionResponse:
      type: object
      required: [user, policy, server_time]
      properties:
        user: { $ref: '#/components/schemas/User' }
        policy: { $ref: '#/components/schemas/Policy' }
        server_time: { type: string, format: date-time }

    User:
      type: object
      required: [firebase_uid, tenant_id, role, display_name, status]
      properties:
        firebase_uid: { type: string }
        tenant_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        team_id: { type: string, format: uuid, nullable: true }
        display_name: { type: string }
        status: { type: string, enum: [active, suspended] }

    Policy:
      type: object
      required: [version, pinned_devices, softphone, offline_grace_hours, rules_version,
                 retention, allow_agent_audio_playback]
      properties:
        version: { type: integer }
        pinned_devices:
          type: array
          description: |
            Admin-pinned audio endpoints, matched by container ID with the friendly
            name as fallback. Capture MUST NOT start from the system default device.
          items:
            type: object
            required: [container_id]
            properties:
              container_id: { type: string }
              friendly_name: { type: string }
        softphone:
          type: object
          description: Tenant configuration for call detection (OPEN-8).
          properties:
            process_names:
              type: array
              items: { type: string }
              example: [Softphone.exe, avaya-oneX.exe]
            uia_account_ref_selector:
              type: string
              nullable: true
              description: UI Automation selector for the account reference; null disables the scrape.
        offline_grace_hours: { type: integer, default: 8 }
        idle_signout_minutes: { type: integer, default: 30 }
        rules_version: { type: integer }
        allow_agent_audio_playback: { type: boolean }
        retention:
          type: object
          properties:
            audio_days: { type: integer }
            transcript_days: { type: integer }
        vad:
          type: object
          properties:
            speech_ms_to_confirm: { type: integer, default: 300 }
            armed_timeout_ms: { type: integer, default: 20000 }
            hangup_silence_ms: { type: integer, default: 8000 }
            wrap_ms: { type: integer, default: 3000 }
            debounce_ms: { type: integer, default: 2000 }

    Heartbeat:
      type: object
      required: [device_id, capture_state, capture_tier, os_build, agent_version, spool_depth, sent_at]
      properties:
        device_id: { type: string, format: uuid }
        capture_state: { $ref: '#/components/schemas/CaptureState' }
        capture_tier: { $ref: '#/components/schemas/CaptureTier' }
        os_build: { type: string }
        agent_version: { type: string }
        spool_depth: { type: integer, description: unacked segments held on disk }
        spool_bytes: { type: integer }
        last_call_at: { type: string, format: date-time, nullable: true }
        dialer_session_active: { type: boolean }
        signed_in: { type: boolean }
        agent_restarts: { type: integer }
        pinned_device_present: { type: boolean }
        events:
          type: array
          description: client-side events since the last heartbeat (no PII)
          items:
            type: object
            required: [kind, at]
            properties:
              kind:
                type: string
                enum: [tier_downgrade, spool_eviction, device_lost, device_restored,
                       agent_restart, capture_error, foreign_audio_suppressed]
              at: { type: string, format: date-time }
              count: { type: integer }
              detail: { type: string }
        sent_at: { type: string, format: date-time }

    Device:
      type: object
      required: [id, machine_guid, os_build, capture_tier, agent_version, status]
      properties:
        id: { type: string, format: uuid }
        machine_guid: { type: string }
        os_build: { type: string }
        capture_tier: { $ref: '#/components/schemas/CaptureTier' }
        agent_version: { type: string }
        pinned_device_id: { type: string, nullable: true }
        status: { type: string, enum: [active, revoked] }
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_capture_state: { $ref: '#/components/schemas/CaptureState' }
        coverage_pct_7d: { type: number, nullable: true }

    CallSummary:
      type: object
      required: [id, started_at, user_uid, capture_tier, status, flag_count]
      properties:
        id: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer, nullable: true }
        user_uid: { type: string }
        account_ref: { type: string, nullable: true }
        direction: { type: string, nullable: true }
        capture_tier: { $ref: '#/components/schemas/CaptureTier' }
        status:
          type: string
          enum: [ingesting, transcribing, analyzing, complete, failed, discarded]
        disposition: { $ref: '#/components/schemas/Disposition' }
        summary: { type: string, nullable: true }
        ptp: { $ref: '#/components/schemas/Ptp' }
        sentiment_delta: { type: number, nullable: true }
        flag_count: { type: integer }
        max_severity: { $ref: '#/components/schemas/Severity' }

    CallPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CallSummary' }
        next_cursor: { type: string, nullable: true }

    CallDetail:
      allOf:
        - $ref: '#/components/schemas/CallSummary'
        - type: object
          properties:
            transcript:
              type: array
              description: speaker-separated turns, merged from the two channels by timestamp
              items: { $ref: '#/components/schemas/TranscriptTurn' }
            sentiment: { $ref: '#/components/schemas/SentimentSeries' }
            flags:
              type: array
              items: { $ref: '#/components/schemas/Flag' }
            talk_ratio: { type: number, nullable: true }
            interruptions: { type: integer, nullable: true }
            next_action: { type: string, nullable: true }
            audio_url:
              type: string
              nullable: true
              description: |
                Short-lived signed URL. Null when the caller's role or the tenant's
                `allow_agent_audio_playback` policy forbids playback. Every issuance
                writes an audit entry.
            analysis:
              type: object
              properties:
                model: { type: string }
                prompt_version: { type: string }
                asr_provider: { type: string }
                asr_version: { type: string }

    TranscriptTurn:
      type: object
      required: [channel, speaker, start_ms, end_ms, text]
      properties:
        channel: { type: integer, enum: [0, 1] }
        speaker: { type: string, enum: [borrower, agent] }
        start_ms: { type: integer }
        end_ms: { type: integer }
        text: { type: string }
        confidence: { type: number, nullable: true }

    SentimentSeries:
      type: object
      properties:
        far:
          type: array
          items: { $ref: '#/components/schemas/SentimentPoint' }
        near:
          type: array
          items: { $ref: '#/components/schemas/SentimentPoint' }
        far_open: { type: number }
        far_close: { type: number }
        delta: { type: number }

    SentimentPoint:
      type: object
      required: [t_ms, v]
      properties:
        t_ms: { type: integer }
        v: { type: number, minimum: -1, maximum: 1 }

    Ptp:
      type: object
      nullable: true
      description: |
        Null when no promise was extracted. When present at all, `present` is
        required, so "no PTP" has exactly one representation rather than three.
      required: [present]
      properties:
        present: { type: boolean }
        amount_paise: { type: integer, format: int64, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        confidence: { type: number }
        evidence_span_ms:
          type: array
          items: { type: integer }
          minItems: 2
          maxItems: 2
        agent_confirmed: { type: boolean, nullable: true }
        agent_amount_paise: { type: integer, format: int64, nullable: true }
        agent_due_date: { type: string, format: date, nullable: true }

    CallConfirmation:
      type: object
      required: [disposition]
      properties:
        disposition: { $ref: '#/components/schemas/Disposition' }
        ptp_present: { type: boolean }
        ptp_amount_paise:
          type: integer
          format: int64
          nullable: true
          description: Paise. Never rupees, never a float.
        ptp_due_date: { type: string, format: date, nullable: true }
        note: { type: string, maxLength: 500 }

    Flag:
      type: object
      required: [id, call_id, rule_id, severity, tier, status]
      properties:
        id: { type: string, format: uuid }
        call_id: { type: string }
        rule_id: { type: string }
        rule_set_version: { type: integer }
        severity: { $ref: '#/components/schemas/Severity' }
        tier: { type: integer, enum: [1, 2], description: 1 deterministic, 2 LLM judge }
        span_start_ms: { type: integer, nullable: true }
        span_end_ms: { type: integer, nullable: true }
        evidence_text: { type: string, nullable: true }
        judge_rationale: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/FlagStatus' }
        reviewer_uid: { type: string, nullable: true }
        agent_response: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }

    AgentStats:
      type: object
      properties:
        user_uid: { type: string }
        display_name: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        calls: { type: integer }
        coverage_pct: { type: number, nullable: true }
        ptp_rate: { type: number, description: PTP calls / connected calls }
        ptp_amount_paise: { type: integer, format: int64 }
        avg_sentiment_delta: { type: number, nullable: true }
        talk_ratio: { type: number, nullable: true }
        flags_per_1000: { type: number }

    LiveCallEvent:
      type: object
      required: [call_id, user_uid, state, started_at]
      properties:
        call_id: { type: string }
        user_uid: { type: string }
        display_name: { type: string }
        state: { $ref: '#/components/schemas/CaptureState' }
        started_at: { type: string, format: date-time }
        elapsed_ms: { type: integer }
        sentiment_far: { type: number, nullable: true }
        sentiment_near: { type: number, nullable: true }
        alert: { type: string, nullable: true }

    RuleSetDefinition:
      type: object
      required: [rules]
      properties:
        call_hours:
          type: object
          properties:
            start: { type: string, example: '08:00' }
            end: { type: string, example: '19:00' }
            timezone: { type: string, default: Asia/Kolkata }
        judge_sample_pct: { type: number, default: 5 }
        rules:
          type: array
          items:
            type: object
            required: [rule_id, enabled, severity]
            properties:
              rule_id: { type: string }
              enabled: { type: boolean }
              severity: { $ref: '#/components/schemas/Severity' }
              params:
                type: object
                additionalProperties: true
                description: rule-specific parameters, e.g. term lists per language

    RuleSet:
      allOf:
        - type: object
          required: [id, version, active, created_at, created_by]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            active: { type: boolean }
            created_at: { type: string, format: date-time }
            created_by: { type: string }
        - $ref: '#/components/schemas/RuleSetDefinition'

    AuditEntry:
      type: object
      required: [id, action, entity, at]
      properties:
        id: { type: integer, format: int64 }
        actor_uid: { type: string, nullable: true }
        action: { type: string }
        entity: { type: string }
        entity_id: { type: string, nullable: true }
        at: { type: string, format: date-time }
        detail:
          type: object
          additionalProperties: true
          description: MUST NOT contain transcript text, borrower names or account references.
