[package]
name = "sentinel-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WASAPI capture (tier A/B), device management, resampling, VAD and foreign-audio suppression."

[dependencies]
sentinel-core = { path = "../sentinel-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true
hound.workspace = true

[target.'cfg(windows)'.dependencies]
# `windows-core` is a direct dependency because the `#[implement]` macro expands to
# paths rooted at that crate, not at `windows::core`.
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
sentinel-core = { path = "../sentinel-core" }
