[package]
name = "sentinel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "State machine, spool, wire protocol and configuration for the Sentinel endpoint agent."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
rand.workspace = true
ulid.workspace = true
uuid.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
# Production builds link SQLCipher instead of plain SQLite. Kept behind a feature so
# CI on Linux does not need the SQLCipher toolchain to run the spool tests; a release
# build without it fails to compile (see the guard in src/spool.rs).
sqlcipher = ["rusqlite/bundled-sqlcipher"]
# Escape hatch for a release-mode benchmark. Never ship with this.
allow-unencrypted-spool = []
