[workspace]
resolver = "2"
members = [
    "sentinel-core",
    "sentinel-capture",
    "sentinel-agent",
    "sentinel-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde-well-known"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = "0.32"
hound = "3"

# PKCE (RFC 7636): S256 challenge and the base64url-no-pad encoding it is expressed in.
sha2 = "0.10"
base64 = "0.22"

# Uplink. `tungstenite` is the synchronous WebSocket implementation; TLS comes from
# rustls so there is one TLS stack in the process and no OpenSSL in the MSI.
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# `ring` is named explicitly rather than inherited from `ureq`'s feature set: the
# device credential builds a `CryptoProvider` by hand (see
# `sentinel-agent/src/device.rs`) and must not have the provider it names disappear
# because a sibling crate's features changed.
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

# REST client for /v1/sessions, /v1/policy, /v1/heartbeat and the token endpoint.
# `ureq` carries client-certificate support, which the device mTLS identity needs.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# Opus at 16 kHz / 24 kbps / 20 ms frames (spec 6.5). `audiopus_sys` builds libopus
# from source when the system does not provide it.
audiopus = { version = "0.2", features = ["encoder"] }

tempfile = "3"
